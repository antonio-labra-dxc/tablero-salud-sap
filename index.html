<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src https://nufwmrvbfivgiogktnrn.supabase.co wss://nufwmrvbfivgiogktnrn.supabase.co; base-uri 'none'; form-action 'self'; object-src 'none'">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Salud de Sistemas SAP</title>
<style>
:root{
  --bg:#090b17;--bg-2:#0d1020;--surface:#121528;--surface-2:#181c33;--surface-3:#21263f;--line:#252a43;--line-2:#323854;
  --ink:#eef0f6;--ink-2:#c9ccda;--muted:#8f95ab;
  --brand:#4995ff;--brand-2:#7fb3ff;--brand-3:#2c6fd6;--brand-4:#1d4a8f;
  --accent:#ffae41;--accent-ink:#ffc982;
  --good:#34c77b;--warn:#f2b33d;--crit:#ff6b6b;--none:#7c8299;
  --shadow:0 1px 2px #0000004d,0 18px 40px -22px #000c;
  --radius:16px;--ease:cubic-bezier(.2,.7,.2,1);
  color-scheme:dark;
}
:root[data-theme="light"]{
  --bg:#f3f4f8;--bg-2:#eceef5;--surface:#ffffff;--surface-2:#f6f7fb;--surface-3:#eceef5;--line:#e0e3ec;--line-2:#cfd3df;
  --ink:#0e1020;--ink-2:#2f3448;--muted:#5d637a;
  --brand:#1f6fe0;--brand-2:#5b97ee;--brand-3:#1858b3;--brand-4:#0f3b7a;
  --accent:#c46a00;--accent-ink:#9a5300;
  --good:#16884f;--warn:#a86b00;--crit:#d23b3b;--none:#6b7188;
  --shadow:0 1px 2px #0e10200f,0 14px 34px -20px #0e102040;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.5 Inter,"Segoe UI",ui-sans-serif,system-ui,sans-serif;-webkit-font-smoothing:antialiased;font-feature-settings:"tnum" 0}
body::before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(900px 420px at 85% -10%,color-mix(in oklab,var(--brand) 14%,transparent),transparent 70%),radial-gradient(700px 360px at -10% 10%,color-mix(in oklab,var(--accent) 9%,transparent),transparent 70%);z-index:0}
a{color:var(--brand);text-decoration:none}a:hover{text-decoration:underline}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:1480px;margin:0 auto;padding:0 28px;position:relative;z-index:1}
/* ---------- encabezado */
header.top{position:sticky;top:0;z-index:20;background:color-mix(in oklab,var(--bg) 82%,transparent);backdrop-filter:blur(14px) saturate(1.2);border-bottom:1px solid var(--line)}
.top .row{display:flex;align-items:center;gap:18px;height:62px}
.brand{display:flex;align-items:center;gap:12px;min-width:0;color:inherit}
.brand:hover{text-decoration:none}
.brand b{display:block;font-size:15px;letter-spacing:-.01em;white-space:nowrap}
.brand small{display:block;color:var(--muted);font-size:11.5px;white-space:nowrap}
.spacer{flex:1}
.ctl{display:flex;align-items:center;gap:8px}
.vivo{display:inline-flex;align-items:center;gap:8px;font-size:12px;color:var(--ink-2);padding:6px 11px;border-radius:999px;border:1px solid var(--line);background:var(--surface);white-space:nowrap}
.vivo i{width:8px;height:8px;border-radius:50%;background:var(--good);box-shadow:0 0 0 0 color-mix(in oklab,var(--good) 60%,transparent);animation:latido 2.4s infinite}
.vivo.local i{background:var(--brand);animation:none}
@keyframes latido{0%{box-shadow:0 0 0 0 color-mix(in oklab,var(--good) 55%,transparent)}70%{box-shadow:0 0 0 8px transparent}100%{box-shadow:0 0 0 0 transparent}}
.field{background:var(--surface);border:1px solid var(--line);border-radius:10px;height:36px;padding:0 10px;min-width:0}
.field:focus{outline:2px solid color-mix(in oklab,var(--brand) 60%,transparent);outline-offset:1px}
.btn{background:var(--surface);border:1px solid var(--line);border-radius:10px;height:36px;padding:0 12px;cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;gap:6px;color:var(--ink);text-decoration:none}
.btn:hover{border-color:var(--line-2);background:var(--surface-2);text-decoration:none}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#1a1205;font-weight:600}
.btn:disabled{opacity:.55;cursor:default}
.kbd{font:11px ui-monospace,Consolas,monospace;border:1px solid var(--line-2);border-bottom-width:2px;border-radius:5px;padding:0 5px;color:var(--muted)}
.buscar{min-width:250px;justify-content:space-between;color:var(--muted)}
nav.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
nav.tabs a{padding:11px 14px;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap;font-weight:500;font-size:13.5px;transition:color .2s}
nav.tabs a:hover{color:var(--ink);text-decoration:none}
nav.tabs a.on{color:var(--ink);border-bottom-color:var(--accent)}
nav.tabs .sep{width:1px;background:var(--line);margin:10px 8px}
main{padding:26px 0 70px;position:relative;z-index:1}
/* ---------- tipografía */
.eyebrow{color:var(--accent);font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase}
h1{font-size:30px;line-height:1.15;letter-spacing:-.025em;margin:6px 0 6px;font-weight:700}
h2{font-size:15.5px;margin:0;letter-spacing:-.01em;font-weight:650}
h3{font-size:13px;margin:0;font-weight:650}
.sub{color:var(--muted);margin:0}
.muted{color:var(--muted)}.small{font-size:12px}.mono{font-family:ui-monospace,Consolas,monospace;font-size:12.5px}
.num,.tab{font-variant-numeric:tabular-nums}
/* ---------- layout */
.grid{display:grid;gap:16px}
.g12{grid-template-columns:repeat(12,minmax(0,1fr))}
.s3{grid-column:span 3}.s4{grid-column:span 4}.s5{grid-column:span 5}.s6{grid-column:span 6}.s7{grid-column:span 7}.s8{grid-column:span 8}.s12{grid-column:span 12}
.g-kpi{grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}
.g-2{grid-template-columns:repeat(auto-fit,minmax(420px,1fr))}
.g-3{grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px 22px;min-width:0;position:relative}
.card-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.card-h .muted{font-size:12px}
.section{margin-top:16px}
.pagehead{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.vista{animation:entrar .45s var(--ease) both}
@keyframes entrar{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
/* ---------- KPI */
.kpi .lbl{color:var(--muted);font-size:12px;font-weight:550;display:flex;align-items:center;gap:6px}
.kpi .val{font-size:30px;font-weight:700;letter-spacing:-.03em;margin-top:6px;font-variant-numeric:tabular-nums;line-height:1.1}
.kpi .val small{font-size:14px;color:var(--muted);font-weight:500;margin-left:3px;letter-spacing:0}
.kpi .foot{color:var(--muted);font-size:12px;margin-top:6px}
.kpi.link{cursor:pointer;transition:border-color .2s,transform .2s var(--ease)}
.kpi.link:hover{border-color:var(--line-2);transform:translateY(-2px)}
.src{display:inline-block;font-size:9.5px;font-weight:650;letter-spacing:.05em;text-transform:uppercase;padding:1px 6px;border-radius:5px;background:var(--surface-3);color:var(--muted)}
.prog{height:6px;border-radius:3px;background:var(--surface-3);overflow:hidden;margin-top:10px}
.prog span{display:block;height:100%;background:var(--brand);border-radius:3px;transform-origin:left;animation:crecer .9s var(--ease) both}
@keyframes crecer{from{transform:scaleX(0)}to{transform:scaleX(1)}}
/* ---------- estado */
.st{display:inline-flex;align-items:center;gap:6px;font-weight:600;font-size:12.5px;white-space:nowrap}
.st i{width:9px;height:9px;border-radius:50%;display:inline-block;flex:none}
.st.rojo{color:var(--crit)}.st.rojo i{background:var(--crit);animation:latidoRojo 2.6s infinite}
@keyframes latidoRojo{0%{box-shadow:0 0 0 0 color-mix(in oklab,var(--crit) 55%,transparent)}70%{box-shadow:0 0 0 6px transparent}100%{box-shadow:0 0 0 0 transparent}}
.st.amarillo{color:var(--warn)}.st.amarillo i{background:var(--warn);border-radius:2px;transform:rotate(45deg) scale(.82)}
.st.verde{color:var(--good)}.st.verde i{background:var(--good)}
.st.sin-datos,.st.desconocido{color:var(--none)}.st.sin-datos i,.st.desconocido i{border:2px solid var(--none);background:transparent}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;border:1px solid var(--line);background:var(--surface-2);font-size:12px;white-space:nowrap}
.pill.prio{border-color:color-mix(in oklab,var(--crit) 50%,var(--line));color:var(--crit)}
.chip{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:6px;background:var(--surface-3);font-size:12px;margin:2px 4px 2px 0;color:var(--ink-2);border:1px solid transparent;white-space:nowrap}
a.chip:hover,button.chip:hover{text-decoration:none;border-color:var(--brand)}
button.chip{cursor:pointer;font:inherit;font-size:12px}
.chip .d{width:7px;height:7px;border-radius:50%;background:var(--none)}
.chip .d.rojo{background:var(--crit)}.chip .d.amarillo{background:var(--warn)}.chip .d.verde{background:var(--good)}
/* filtros tipo segmento */
.segm{display:inline-flex;gap:4px;flex-wrap:wrap}
.segm button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;cursor:pointer;font-size:12.5px;color:var(--ink-2);display:inline-flex;gap:6px;align-items:center;transition:all .15s}
.segm button:hover{border-color:var(--line-2)}
.segm button.on{background:color-mix(in oklab,var(--brand) 18%,var(--surface));border-color:color-mix(in oklab,var(--brand) 60%,var(--line));color:var(--ink)}
.segm button b{font-variant-numeric:tabular-nums;color:var(--muted);font-weight:600}
.segm button.on b{color:var(--brand-2)}
/* ---------- titular */
.hero{display:grid;grid-template-columns:1fr auto;gap:28px;align-items:center;overflow:hidden}
.hero h1{font-size:28px;max-width:860px}
.hero h1 em{font-style:normal;color:var(--accent)}
.hero .crit{color:var(--crit)}
.hero-meta{display:flex;flex-wrap:wrap;gap:8px 18px;margin-top:12px;color:var(--muted);font-size:12.5px}
.hero-meta b{color:var(--ink-2);font-weight:600}
.dona{position:relative;width:176px;height:176px;flex:none}
.dona svg{width:100%;height:100%;transform:rotate(-90deg)}
.dona circle{fill:none;stroke-width:16}
.dona .seg{transition:stroke-dasharray 1.1s var(--ease)}
.dona .centro{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.dona .centro b{font-size:34px;font-weight:750;letter-spacing:-.03em;line-height:1}
.dona .centro span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-top:4px}
.leyenda{display:grid;gap:8px;min-width:170px}
.leyenda div{display:flex;justify-content:space-between;gap:14px;align-items:center;font-size:13px}
.leyenda b{font-variant-numeric:tabular-nums}
/* ---------- ranking de atención */
.rank{display:grid;gap:4px}
.rank-row{display:grid;grid-template-columns:28px 92px minmax(0,1fr) 46px;gap:12px;align-items:center;padding:8px 10px;border-radius:10px;cursor:pointer;transition:background .15s}
.rank-row:hover{background:var(--surface-2)}
.rank-row .pos{color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
.rank-row .sid{font-weight:700;letter-spacing:.02em;display:flex;align-items:center;gap:7px}
.rank-row .prod{font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rank-row .score{font-size:18px;font-weight:700;text-align:right;font-variant-numeric:tabular-nums}
.pila{display:flex;height:10px;border-radius:5px;overflow:hidden;gap:2px;background:var(--surface-3)}
.pila span{height:100%;transform-origin:left;animation:crecer .9s var(--ease) both}
.p1{background:var(--brand-4)}.p2{background:var(--brand-3)}.p3{background:var(--brand)}.p4{background:var(--brand-2)}
.ley-pila{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--muted);margin-top:12px}
.ley-pila i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
/* ---------- temas */
.tema{display:grid;grid-template-columns:minmax(0,1fr) 120px 34px;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer}
.tema:last-child{border-bottom:none}
.tema:hover .t1{color:var(--brand-2)}
.tema .t1{font-weight:600;font-size:13.5px;transition:color .15s}
.tema .t2{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tema .n{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
.barra{height:8px;border-radius:4px;background:var(--surface-3);overflow:hidden}
.barra span{display:block;height:100%;background:var(--brand);border-radius:4px;transform-origin:left;animation:crecer .9s var(--ease) both}
/* ---------- tarjetas de sistema */
.tarjetas{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.tsis{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;cursor:pointer;position:relative;overflow:hidden;transition:transform .2s var(--ease),border-color .2s;animation:entrar .5s var(--ease) both}
.tsis:hover{transform:translateY(-2px);border-color:var(--line-2)}
.tsis::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--none)}
.tsis.rojo::before{background:var(--crit)}.tsis.amarillo::before{background:var(--warn)}.tsis.verde::before{background:var(--good)}
.tsis .top1{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.tsis .sid{font-size:20px;font-weight:750;letter-spacing:.02em;line-height:1.1}
.tsis .prod{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.tsis .mini{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:12px}
.tsis .mini div{background:var(--surface-2);border-radius:8px;padding:6px 8px}
.tsis .mini span{display:block;font-size:9.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.03em;white-space:nowrap}
.tsis .mini b{font-size:13.5px;font-variant-numeric:tabular-nums;white-space:nowrap}
.tsis .mini div{min-width:0}
.ikpi{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}.ikpi.c{grid-template-columns:repeat(2,minmax(0,1fr))}
.atajos{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:14px}
@media (max-width:820px){.ikpi{grid-template-columns:repeat(2,minmax(0,1fr))}.atajos{grid-template-columns:1fr}}
.anillo{position:relative;width:46px;height:46px;flex:none}
.anillo svg{width:100%;height:100%;transform:rotate(-90deg)}
.anillo circle{fill:none;stroke-width:5}
.anillo .v{transition:stroke-dasharray 1s var(--ease)}
.anillo b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;font-variant-numeric:tabular-nums}
.anillo.g{width:88px;height:88px}.anillo.g circle{stroke-width:8}.anillo.g b{font-size:24px}
/* ---------- tablas */
.tbl-wrap{overflow:auto;border:1px solid var(--line);border-radius:12px;max-height:680px}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
th{position:sticky;top:0;background:var(--surface-2);color:var(--muted);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.05em;cursor:pointer;white-space:nowrap;z-index:1}
th:hover{color:var(--ink)}
tr:last-child td{border-bottom:none}
tbody tr{transition:background .12s}
tbody tr:hover td{background:color-mix(in oklab,var(--surface-2) 75%,transparent)}
tbody tr[data-drawer]{cursor:pointer}
td.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px}
.celda-heat{display:inline-flex;min-width:30px;height:24px;align-items:center;justify-content:center;border-radius:6px;font-weight:650;font-variant-numeric:tabular-nums;font-size:12px}
.bullet{display:flex;align-items:center;gap:8px;justify-content:flex-end}
.bullet .b{width:64px;height:6px;border-radius:3px;background:var(--surface-3);overflow:hidden;flex:none}
.bullet .b span{display:block;height:100%;background:var(--brand);transform-origin:left;animation:crecer .8s var(--ease) both}
.bullet.alto .b span{background:var(--warn)}.bullet.alto{color:var(--warn)}
/* ---------- hallazgos agrupados */
.hgrupo{border:1px solid var(--line);border-radius:14px;padding:14px 16px;background:var(--surface);margin-bottom:10px;animation:entrar .45s var(--ease) both}
.hgrupo .h1r{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:start}
.hgrupo .ico{width:30px;height:30px;border-radius:9px;display:flex;align-items:center;justify-content:center;background:var(--surface-3);font-size:14px}
.hgrupo .ico.p{background:color-mix(in oklab,var(--crit) 18%,var(--surface));color:var(--crit)}
.hgrupo .tt{font-weight:600;font-size:14px;line-height:1.4}
.hgrupo .meta{font-size:12px;color:var(--muted);margin-top:3px;display:flex;gap:10px;flex-wrap:wrap}
.hgrupo .cnt{text-align:right}
.hgrupo .cnt b{font-size:22px;font-weight:750;display:block;line-height:1;font-variant-numeric:tabular-nums}
.hgrupo .cnt span{font-size:11px;color:var(--muted)}
.hgrupo .sids{margin-top:10px;padding-left:42px}
details.en{margin-top:6px;padding-left:42px;font-size:12px;color:var(--muted)}
details.en summary{cursor:pointer;width:max-content}
.seguir{height:6px;border-radius:3px;overflow:hidden;display:flex;background:var(--surface-3);width:120px;margin-left:auto;margin-top:6px}
.seguir span{height:100%}
/* ---------- ficha */
.ficha-h{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:24px;align-items:center}
.ficha-h .sidbig{font-size:46px;font-weight:800;letter-spacing:.02em;line-height:1}
.ficha-h .prodl{font-size:15px;margin-top:6px;color:var(--ink-2)}
.ficha-h .chips{margin-top:12px}
.ficha-score{display:flex;align-items:center;gap:18px}
.ficha-score .desg{display:grid;gap:4px;font-size:12px;min-width:200px}
.ficha-score .desg div{display:flex;justify-content:space-between;gap:12px}
.ficha-score .desg b{font-variant-numeric:tabular-nums}
.ftabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:22px 0 18px;overflow-x:auto;scrollbar-width:none}
.ftabs a{padding:10px 14px;color:var(--muted);border-bottom:2px solid transparent;font-weight:550;white-space:nowrap}
.ftabs a:hover{color:var(--ink);text-decoration:none}
.ftabs a.on{color:var(--ink);border-bottom-color:var(--brand)}
.ftabs a .n{font-size:11px;background:var(--surface-3);border-radius:999px;padding:1px 7px;margin-left:6px;color:var(--ink-2)}
.dl{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px 22px}
.dl div span{display:block;color:var(--muted);font-size:11.5px}
.dl div b{font-weight:550;font-size:13.5px}
.atajo{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px;border:1px solid var(--line);border-radius:12px;background:var(--surface-2);cursor:pointer;transition:border-color .15s,transform .2s var(--ease);color:var(--ink)}
.atajo:hover{border-color:var(--line-2);transform:translateY(-1px);text-decoration:none}
.atajo b{font-size:22px;font-variant-numeric:tabular-nums}
.atajo .muted{font-size:12px}
.fila-h{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:start;padding:12px 0;border-bottom:1px solid var(--line)}
.fila-h:last-child{border-bottom:none}
.fila-h .dot{width:8px;height:8px;border-radius:50%;margin-top:7px;background:var(--warn)}
.fila-h .dot.p{background:var(--crit)}
/* ---------- línea de tiempo */
.tl{position:relative;padding:30px 0 6px}
.tl-eje{position:relative;height:22px;border-bottom:1px solid var(--line);margin-left:150px}
.tl-eje span{position:absolute;top:0;font-size:11px;color:var(--muted);transform:translateX(-50%);white-space:nowrap}
.tl-row{display:grid;grid-template-columns:150px minmax(0,1fr);align-items:center;min-height:40px;border-bottom:1px dashed var(--line)}
.tl-row .lbl{font-size:12.5px;font-weight:600;color:var(--ink-2)}
.tl-row .pista{position:relative;height:56px}
.tl-hoy{position:absolute;top:0;bottom:0;width:2px;background:var(--accent);opacity:.85}
.hoy-l{color:var(--accent)!important;font-weight:700;text-transform:uppercase;letter-spacing:.08em}
.tl-zona{position:absolute;top:0;bottom:0;background:color-mix(in oklab,var(--crit) 7%,transparent)}
.tl-p{position:absolute;top:50%;border-radius:50%;border:2px solid var(--surface);cursor:pointer;transition:transform .15s;animation:aparecer .6s var(--ease) both;display:flex;align-items:center;justify-content:center;font-size:10.5px;font-weight:750;color:#10131f;box-shadow:0 0 0 1px color-mix(in oklab,var(--ink) 10%,transparent)}
.tl-p:hover{transform:scale(1.5);z-index:2}
.tl-p.rojo{background:var(--crit)}.tl-p.amarillo{background:var(--warn)}.tl-p.verde{background:var(--good)}
@keyframes aparecer{from{opacity:0;transform:scale(.2)}to{opacity:1;transform:scale(1)}}
/* ---------- panel lateral */
.velo{position:fixed;inset:0;background:#0007;backdrop-filter:blur(2px);z-index:40;opacity:0;pointer-events:none;transition:opacity .25s}
.velo.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(520px,100vw);background:var(--surface);border-left:1px solid var(--line);z-index:41;transform:translateX(102%);transition:transform .35s var(--ease);overflow:auto;padding:22px 24px 40px;box-shadow:-30px 0 60px -30px #000a}
.drawer.on{transform:none}
.drawer .cerrar{position:absolute;top:16px;right:16px}
/* ---------- paleta de comandos */
.paleta{position:fixed;inset:0;z-index:50;display:none;align-items:flex-start;justify-content:center;padding-top:12vh;background:#0008;backdrop-filter:blur(3px)}
.paleta.on{display:flex}
.paleta .caja{width:min(640px,calc(100vw - 32px));background:var(--surface);border:1px solid var(--line-2);border-radius:16px;box-shadow:0 30px 80px -20px #000c;overflow:hidden;animation:entrar .2s var(--ease)}
.paleta input{width:100%;border:0;border-bottom:1px solid var(--line);background:transparent;height:54px;padding:0 18px;font-size:16px;outline:none}
.paleta .res{max-height:52vh;overflow:auto;padding:6px}
.paleta .op{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:9px 12px;border-radius:10px;cursor:pointer;color:var(--ink)}
.paleta .op.act,.paleta .op:hover{background:var(--surface-2)}
.paleta .op small{color:var(--muted)}
.paleta .grupo-t{font-size:10.5px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);padding:10px 12px 4px}
/* ---------- varios */
.empty{padding:28px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:12px}
.note{border-left:3px solid var(--accent);background:color-mix(in oklab,var(--accent) 8%,var(--surface));padding:10px 14px;border-radius:0 8px 8px 0;color:var(--ink-2);font-size:13px}
.tip{position:fixed;pointer-events:none;z-index:60;background:var(--surface-3);border:1px solid var(--line-2);color:var(--ink);padding:8px 11px;border-radius:9px;font-size:12px;box-shadow:var(--shadow);max-width:360px;display:none;line-height:1.45}
.lnk{cursor:pointer}
footer{color:var(--muted);font-size:12px;padding:22px 0;border-top:1px solid var(--line);position:relative;z-index:1}
.metodo{font-size:11.5px;color:var(--muted);margin-top:14px;line-height:1.5}
/* versión web: sesión, diálogo, seguimiento */
body.sin-sesion header.top .ctl,body.sin-sesion nav.tabs,body.sin-sesion footer,body.sin-sesion .vivo{display:none}
.login{display:grid;grid-template-columns:1.1fr minmax(320px,420px);gap:48px;align-items:center;min-height:calc(100vh - 160px)}
.login-hero h1{font-size:46px;margin:10px 0 12px}
.login-hero .sub{font-size:16px;max-width:520px}
.login-form label,.dlg-form label{display:block;font-size:12.5px;color:var(--muted);margin-bottom:12px}
.login-form .field,.dlg-form .field{display:block;width:100%;margin-top:6px;height:42px;background:var(--surface-2)}
.dlg-form textarea.field{height:auto;padding:8px 10px;resize:vertical}
.login-links{display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;margin-top:14px;font-size:12.5px}
.msg{min-height:18px;margin:4px 0 12px}
.clave-campo{display:inline-flex;gap:6px;align-items:center}.clave-campo .field{font-family:ui-monospace,Consolas,monospace;min-width:210px}
.dlg-form .clave-campo{display:flex;margin-top:6px}.dlg-form .clave-campo .field{margin-top:0}
.acciones{display:inline-flex;gap:6px;flex-wrap:wrap}.acciones .btn{height:30px;padding:0 10px}
dialog{background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);width:min(560px,calc(100vw - 32px));padding:22px}
dialog::backdrop{background:#0008}
.pill.seg{cursor:pointer;font:inherit;font-size:12px;color:var(--ink-2)}
.pill.seg:disabled{cursor:default}
.seg-en_atencion{border-color:color-mix(in oklab,var(--brand) 60%,var(--line))!important;color:var(--brand)!important}
.seg-resuelto{border-color:color-mix(in oklab,var(--good) 60%,var(--line))!important;color:var(--good)!important}
.seg-aceptado{border-color:var(--muted)!important;color:var(--muted)!important}
@media (max-width:1240px){.brand small{display:none}.buscar{min-width:0}.buscar .txt{display:none}}
@media (max-width:1100px){.s3,.s4,.s5,.s6,.s7,.s8{grid-column:span 12}}
@media (max-width:820px){
  .wrap{padding:0 16px}
  .top .row{flex-wrap:wrap;height:auto;padding:10px 0;gap:10px}
  .vivo{display:none}
  .g-2,.g-3{grid-template-columns:1fr}
  .hero,.ficha-h{grid-template-columns:1fr}
  .hero h1{font-size:22px}
  .dona{width:150px;height:150px}
  h1{font-size:24px}.ficha-h .sidbig{font-size:36px}
  .login{grid-template-columns:1fr;gap:20px;min-height:0;padding-top:12px}.login-hero h1{font-size:30px}
  .rank-row{grid-template-columns:22px 70px minmax(0,1fr) 36px;gap:8px}
  .tema{grid-template-columns:minmax(0,1fr) 70px 28px}
  .tl-eje{margin-left:96px}.tl-row{grid-template-columns:96px minmax(0,1fr)}
  .hgrupo .sids,details.en{padding-left:0}
  .ficha-score{flex-wrap:wrap}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
@media print{
  header.top{position:static}.ctl,nav.tabs,.vivo{display:none}
  body{background:#fff;color:#000}body::before{display:none}
  .card{box-shadow:none;break-inside:avoid}
  .tbl-wrap{max-height:none;overflow:visible}
}
