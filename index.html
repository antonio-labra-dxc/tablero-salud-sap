<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src https://nufwmrvbfivgiogktnrn.supabase.co wss://nufwmrvbfivgiogktnrn.supabase.co; base-uri 'none'; form-action 'self'; object-src 'none'">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Salud de Sistemas SAP</title>
<style>
:root{
  --bg:#0b0d1a;--surface:#141729;--surface-2:#1a1e33;--surface-3:#22273f;--line:#262a40;
  --ink:#eef0f6;--ink-2:#c9ccda;--muted:#9aa0b4;
  --brand:#4995ff;--accent:#ffae41;--accent-ink:#ffc982;
  --good:#34c77b;--warn:#f2b33d;--crit:#ff6b6b;--none:#7c8299;
  --shadow:0 1px 2px #0000004d,0 12px 32px -16px #0009;
  --radius:14px;
  color-scheme:dark;
}
:root[data-theme="light"]{
  --bg:#f3f4f8;--surface:#ffffff;--surface-2:#f6f7fb;--surface-3:#eceef5;--line:#dfe2ec;
  --ink:#0e1020;--ink-2:#2f3448;--muted:#5d637a;
  --brand:#1f6fe0;--accent:#c46a00;--accent-ink:#9a5300;
  --good:#16884f;--warn:#a86b00;--crit:#d23b3b;--none:#6b7188;
  --shadow:0 1px 2px #0e10200f,0 12px 32px -18px #0e102033;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.45 Inter,"Segoe UI",ui-sans-serif,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
a{color:var(--brand);text-decoration:none}a:hover{text-decoration:underline}
button,input,select{font:inherit;color:inherit}
.wrap{max-width:1440px;margin:0 auto;padding:0 24px}
/* header */
header.top{position:sticky;top:0;z-index:20;background:color-mix(in oklab,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top .row{display:flex;align-items:center;gap:20px;height:64px}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.brand b{display:block;font-size:15px;letter-spacing:-.01em}
.brand small{display:block;color:var(--muted);font-size:11.5px;white-space:nowrap}
.brand b{white-space:nowrap}
@media (max-width:1240px){.brand small{display:none}#buscaSid{width:180px!important}}
.spacer{flex:1}
.ctl{display:flex;align-items:center;gap:8px}
.field{background:var(--surface);border:1px solid var(--line);border-radius:10px;height:36px;padding:0 10px;min-width:0}
.field:focus{outline:2px solid color-mix(in oklab,var(--brand) 60%,transparent);outline-offset:1px}
.btn{background:var(--surface);border:1px solid var(--line);border-radius:10px;height:36px;padding:0 12px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#1a1205;font-weight:600}
nav.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
nav.tabs a{padding:12px 14px;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap;font-weight:500}
nav.tabs a:hover{color:var(--ink);text-decoration:none}
nav.tabs a.on{color:var(--ink);border-bottom-color:var(--accent)}
main{padding:28px 0 64px}
/* typography */
.eyebrow{color:var(--accent);font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase}
h1{font-size:30px;line-height:1.15;letter-spacing:-.02em;margin:6px 0 4px}
h2{font-size:16px;margin:0;letter-spacing:-.01em}
.sub{color:var(--muted);margin:0}
.muted{color:var(--muted)}.small{font-size:12px}.mono{font-family:ui-monospace,Consolas,monospace;font-size:12.5px}
/* layout */
.grid{display:grid;gap:16px}
.g-kpi{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.g-2{grid-template-columns:repeat(auto-fit,minmax(420px,1fr))}
.g-3{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px 20px;min-width:0}
.card-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:14px}
.card-h .muted{font-size:12px}
.section{margin-top:22px}
.pagehead{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:22px}
/* kpi tile */
.kpi .lbl{color:var(--muted);font-size:12px;font-weight:500}
.kpi .val{font-size:28px;font-weight:650;letter-spacing:-.02em;margin-top:6px;font-variant-numeric:tabular-nums}
.kpi .val small{font-size:14px;color:var(--muted);font-weight:500;margin-left:3px}
.kpi .foot{color:var(--muted);font-size:12px;margin-top:4px}
.src{display:inline-block;font-size:10px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;padding:1px 6px;border-radius:5px;background:var(--surface-3);color:var(--muted);vertical-align:2px}
/* status */
.st{display:inline-flex;align-items:center;gap:6px;font-weight:600;font-size:12.5px;white-space:nowrap}
.st i{width:10px;height:10px;border-radius:50%;display:inline-block;flex:none}
.st.rojo{color:var(--crit)}.st.rojo i{background:var(--crit)}
.st.amarillo{color:var(--warn)}.st.amarillo i{background:var(--warn);border-radius:2px;transform:rotate(45deg) scale(.85)}
.st.verde{color:var(--good)}.st.verde i{background:var(--good)}
.st.sin-datos,.st.desconocido{color:var(--none)}.st.sin-datos i,.st.desconocido i{border:2px solid var(--none);background:transparent}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;border:1px solid var(--line);background:var(--surface-2);font-size:12px;white-space:nowrap}
.pill.prio{border-color:color-mix(in oklab,var(--crit) 55%,var(--line));color:var(--crit)}
.chip{display:inline-block;padding:2px 8px;border-radius:6px;background:var(--surface-3);font-size:12px;margin:2px 4px 2px 0}
a.chip:hover{text-decoration:none;outline:1px solid var(--brand)}
/* stacked bar */
.stack{display:flex;height:14px;border-radius:7px;overflow:hidden;gap:2px;background:var(--surface)}
.stack span{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:14px;margin-top:12px}
/* bars */
.bars{display:grid;gap:10px}
.bar{display:grid;grid-template-columns:minmax(120px,38%) 1fr 44px;align-items:center;gap:12px;cursor:default}
.bar .t{font-size:12.5px;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar .track{height:10px;background:var(--surface-2);border-radius:0 5px 5px 0}
.bar .fill{height:100%;background:var(--brand);border-radius:0 4px 4px 0;min-width:2px}
.bar .n{text-align:right;font-variant-numeric:tabular-nums;font-weight:600;font-size:12.5px}
.bar:hover .fill{filter:brightness(1.15)}
/* health map */
.fams{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,340px),1fr));gap:12px;align-items:start}
.fam{background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:12px}
.fam-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:0 0 10px}
.fam-h b{font-size:13px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.fam .tile{background:var(--surface)}
.grupo{margin-bottom:18px}.grupo:last-child{margin-bottom:0}
.grupo .tiles{grid-template-columns:repeat(auto-fill,minmax(128px,1fr))}
@media (max-width:820px){.tiles,.grupo .tiles{grid-template-columns:repeat(auto-fill,minmax(104px,1fr))}.tile .p{display:none}.tile{padding:8px 10px}}
.tile{display:block;background:var(--surface-2);border:1px solid var(--line);border-left:4px solid var(--none);border-radius:10px;padding:10px 12px;color:var(--ink);transition:transform .12s,border-color .12s}
.tile:hover{text-decoration:none;transform:translateY(-1px);border-color:var(--muted)}
.tile.rojo{border-left-color:var(--crit)}.tile.amarillo{border-left-color:var(--warn)}.tile.verde{border-left-color:var(--good)}
.tile .sid{font-size:17px;font-weight:700;letter-spacing:.02em;display:flex;justify-content:space-between;align-items:center}
.tile .p{font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin:2px 0 6px}
.tile .m{display:flex;justify-content:space-between;font-size:11.5px;color:var(--ink-2)}
/* tables */
.tbl-wrap{overflow:auto;border:1px solid var(--line);border-radius:10px;max-height:640px}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}
th{position:sticky;top:0;background:var(--surface-2);color:var(--muted);font-weight:600;font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;cursor:pointer;white-space:nowrap;z-index:1}
th:hover{color:var(--ink)}
tr:last-child td{border-bottom:none}
tbody tr:hover td{background:color-mix(in oklab,var(--surface-2) 70%,transparent)}
td.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
/* heatmap */
.heat td,.heat th{text-align:center;padding:6px 4px;border:2px solid var(--surface);border-radius:6px}
.heat th{position:static;cursor:default;font-size:10.5px;text-transform:none;letter-spacing:0;background:transparent;white-space:normal;vertical-align:bottom}
.heat td.c{font-variant-numeric:tabular-nums;font-weight:600;min-width:42px;border-radius:6px}
.heat td.s{text-align:left;font-weight:700;white-space:nowrap}
/* findings */
.finding{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;padding:12px 0;border-bottom:1px solid var(--line)}
.finding:last-child{border-bottom:none}
.finding .dot{width:8px;height:8px;border-radius:50%;margin-top:6px;background:var(--warn)}
.finding .dot.p{background:var(--crit);box-shadow:0 0 0 3px color-mix(in oklab,var(--crit) 25%,transparent)}
.finding .en{color:var(--muted);font-size:11.5px}
.cat-h{display:flex;justify-content:space-between;align-items:center;margin:16px 0 2px;padding-bottom:6px;border-bottom:1px solid var(--line)}
.cat-h:first-child{margin-top:0}
/* hero sid */
.hero{display:grid;grid-template-columns:1fr auto;gap:20px;align-items:start}
.hero .sidbig{font-size:44px;font-weight:750;letter-spacing:.02em;line-height:1}
.meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px 20px;margin-top:16px}
.meta div span{display:block;color:var(--muted);font-size:11.5px}
.meta div b{font-weight:550;font-size:13px}
.badge-big{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.badge-big .st{font-size:15px}.badge-big .st i{width:14px;height:14px}
.empty{padding:28px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:10px}
.note{border-left:3px solid var(--accent);background:color-mix(in oklab,var(--accent) 8%,var(--surface));padding:10px 14px;border-radius:0 8px 8px 0;color:var(--ink-2);font-size:13px}
.tip{position:fixed;pointer-events:none;z-index:50;background:var(--surface-3);border:1px solid var(--line);color:var(--ink);padding:8px 10px;border-radius:8px;font-size:12px;box-shadow:var(--shadow);max-width:340px;display:none}
.combo{position:relative}
.combo-list{position:absolute;top:40px;left:0;right:0;min-width:280px;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);max-height:380px;overflow:auto;display:none;z-index:30}
.combo-list a{display:flex;justify-content:space-between;gap:10px;padding:8px 12px;color:var(--ink);border-bottom:1px solid var(--line)}
.combo-list a:hover,.combo-list a.act{background:var(--surface-2);text-decoration:none}
footer{color:var(--muted);font-size:12px;padding:24px 0;border-top:1px solid var(--line)}
/* versión web: sesión, diálogo, seguimiento */
body.sin-sesion header.top .ctl,body.sin-sesion nav.tabs,body.sin-sesion footer{display:none}
.login{display:grid;grid-template-columns:1.1fr minmax(320px,420px);gap:48px;align-items:center;min-height:calc(100vh - 160px)}
.login-hero h1{font-size:44px;margin:10px 0 12px}
.login-hero .sub{font-size:16px;max-width:520px}
.login-form label,.dlg-form label{display:block;font-size:12.5px;color:var(--muted);margin-bottom:12px}
.login-form .field,.dlg-form .field{display:block;width:100%;margin-top:6px;height:42px;background:var(--surface-2)}
.dlg-form textarea.field{height:auto;padding:8px 10px;resize:vertical}
.login-links{display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;margin-top:14px;font-size:12.5px}
.msg{min-height:18px;margin:4px 0 12px}
dialog{background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);width:min(560px,calc(100vw - 32px));padding:22px}
dialog::backdrop{background:#0008}
.pill.seg{cursor:pointer;font:inherit;font-size:12px;color:var(--ink-2)}
.pill.seg:disabled{cursor:default}
.seg-en_atencion{border-color:color-mix(in oklab,var(--brand) 60%,var(--line))!important;color:var(--brand)!important}
.seg-resuelto{border-color:color-mix(in oklab,var(--good) 60%,var(--line))!important;color:var(--good)!important}
.seg-aceptado{border-color:var(--muted)!important;color:var(--muted)!important}
@media (max-width:820px){.login{grid-template-columns:1fr;gap:20px;min-height:0;padding-top:12px}.login-hero h1{font-size:30px}}
@media (max-width:820px){
  .wrap{padding:0 16px}
  .top .row{flex-wrap:wrap;height:auto;padding:10px 0;gap:10px}
  .ctl{width:100%}.ctl .combo{flex:1}.ctl .field{width:100%}
  .g-2,.g-3{grid-template-columns:1fr}
  .hero{grid-template-columns:1fr}.badge-big{align-items:flex-start}
  h1{font-size:24px}
  .bar{grid-template-columns:1fr 60px 36px}
}
@media print{
  header.top{position:static}.ctl,nav.tabs{display:none}
  body{background:#fff;color:#000}
  .card{box-shadow:none;break-inside:avoid}
  .tbl-wrap{max-height:none;overflow:visible}
}
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="row">
      <a class="brand" href="#/resumen" style="color:inherit;text-decoration:none">
        <svg width="30" height="30" viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="11" fill="none" stroke="var(--surface-3)" stroke-width="5"/><path d="M16 5a11 11 0 1 1-10.4 7.4" fill="none" stroke="var(--accent)" stroke-width="5" stroke-linecap="round"/></svg>
        <span><b>Salud de Sistemas SAP</b><small>DXC Technology · Coca-Cola FEMSA</small></span>

<main><div class="wrap" id="app"></div></main>
<footer><div class="wrap" id="pie"></div></footer>
<div class="tip" id="tip"></div>

</body>
</html>
